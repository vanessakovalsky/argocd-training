# kind cluster for the ArgoCD training (kind v0.33.0)
# Host port 8443 -> NodePort 30443 (argocd-server, exercise 02.3)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: argocd-formation
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    extraPortMappings:
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
