# Webhook receiver for the training (logs every received request)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertes-receiver
  namespace: flotte-ops
  labels: {app.kubernetes.io/name: alertes-receiver}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: alertes-receiver}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alertes-receiver}
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:38
          env:
            - {name: HTTP_PORT, value: "8080"}
            - {name: LOG_IGNORE_PATH, value: "/healthz"}
          ports: [{name: http, containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: alertes-receiver
  namespace: flotte-ops
spec:
  selector: {app.kubernetes.io/name: alertes-receiver}
  ports: [{name: http, port: 80, targetPort: http}]
