# Grafana minimal (démonstration M07) : source Prometheus pré-provisionnée,
# accès anonyme administrateur (poste local uniquement, jamais en production).
# Accès : kubectl port-forward -n flotte-ops svc/grafana 3000:3000 -> http://localhost:3000
# Tableau de bord officiel : examples/dashboard.json du dépôt argoproj/argo-cd (Dashboards -> New -> Import).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: flotte-ops
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.flotte-ops.svc:9090
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: flotte-ops
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.3.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: flotte-ops
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
