apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flotte-web-dev
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.flotte-deployed.flotte-alertes: ""
    notifications.argoproj.io/subscribe.flotte-degraded.flotte-alertes: ""
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: flotte
  source:
    repoURL: https://gitlab.com/<GITLAB_USER>/flotte-config.git
    targetRevision: main
    path: apps/flotte-web/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: flotte-dev
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
