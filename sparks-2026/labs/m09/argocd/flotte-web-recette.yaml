apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flotte-web-recette
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: flotte
  source:
    repoURL: https://gitlab.com/<GITLAB_USER>/flotte-config.git
    targetRevision: main
    path: apps/flotte-web/overlays/recette
  destination:
    server: https://kubernetes.default.svc
    namespace: flotte-recette
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
