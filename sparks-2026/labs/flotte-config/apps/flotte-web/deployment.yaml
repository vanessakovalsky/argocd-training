apiVersion: apps/v1
kind: Deployment
metadata:
  name: flotte-web
  labels:
    app.kubernetes.io/name: flotte-web
    app.kubernetes.io/part-of: hexa-mobilite
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: flotte-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flotte-web
        app.kubernetes.io/part-of: hexa-mobilite
    spec:
      containers:
        - name: flotte-web
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          envFrom:
            - configMapRef:
                name: flotte-web-config
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
