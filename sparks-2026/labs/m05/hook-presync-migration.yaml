apiVersion: batch/v1
kind: Job
metadata:
  name: flotte-db-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: busybox:1.37
          command: ["sh", "-c", "echo 'Migration schema flotte v2'; sleep 5; echo 'OK'"]
